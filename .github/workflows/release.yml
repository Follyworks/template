name: release

# STUDIO-12: releasing is `git tag v1.2.0 && git push --tags`. Everything below is
# derived - the version comes from the tag, the changelog from the commits since the
# previous tag. Nothing is retyped, so nothing can disagree.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, release, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # generate-notes needs the full tag history

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The tag is the source of truth. If gradle.properties disagrees the release is
      # mislabelled, and that is only ever caught by a user, so fail here instead.
      - name: Check tag matches mod_version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          prop="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$tag" != "$prop" ]; then
            echo "::error::tag $tag does not match mod_version $prop in gradle.properties"
            exit 1
          fi

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            build/libs/*.jar
          gh release view "$GITHUB_REF_NAME" --json body -q .body > build/changelog.md

      # STUDIO-14: Maven artifact for anything that wants to compile against this mod.
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository --no-daemon

      # STUDIO-13: only the stores that have an id in gradle.properties. A store with an
      # id but no token fails the job on purpose, that is a misconfiguration and it
      # should be loud. The GitHub release stays a draft until you publish it by hand
      # (docs/release-checklist.md), the stores go live immediately.
      - name: Publish to Modrinth and CurseForge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          tasks=""
          grep -qE '^modrinth_id=.+' gradle.properties && tasks="$tasks modrinth"
          grep -qE '^curseforge_id=.+' gradle.properties && tasks="$tasks curseforge"
          if [ -z "$tasks" ]; then
            echo "::notice::modrinth_id and curseforge_id are empty in gradle.properties, no store publish"
            exit 0
          fi
          ./gradlew $tasks -Pchangelog_file=build/changelog.md --no-daemon

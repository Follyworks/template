plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.25'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.modrinth.minotaur' version '2.9.0'
    // ponytail: 1.1.28 is the last CurseForgeGradle that runs on a Java 21 Gradle JVM,
    // 1.2.30+ declare a JVM 25 floor. Bump when the studio moves its build JVM.
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// STUDIO-6: semver in gradle.properties, Minecraft version appended as build metadata.
// A version bump is one line in gradle.properties and nothing else.
version = "${mod_version}+${minecraft_version}"
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

        // ./gradlew runClient -PquickPlayWorld="New World"
        if (project.hasProperty('quickPlayWorld')) {
            programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlayWorld').toString()
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }

    gameTestServer {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        programArguments.addAll '--mod', project.mod_id,
                '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:6.1.3"
}

// STUDIO-8: gradle spotlessApply formats, gradle check fails on drift.
// ratchetFrom is deliberately unset - the template has no history to ratchet against,
// and a whole-repo format on a fresh mod is free.
spotless {
    java {
        target 'src/main/java/**/*.java'
        // palantir over google-java-format: 120 columns, and it does not fight
        // the long generic signatures NeoForge registries produce.
        palantirJavaFormat('2.39.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
        licenseHeader '/* SPDX-License-Identifier: MIT */\n'
    }
    format 'misc', {
        target '*.md', '*.gradle', '.gitignore', '.gitattributes', '.editorconfig'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// a name listed here that is missing from gradle.properties fails the build
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// STUDIO-14: GitHub Packages, so other mods can `implementation "io.github.follyworks:<mod>:<ver>"`.
// CI publishes on every release with the workflow's own GITHUB_TOKEN. Locally, `publish` drops
// into ./repo instead, which is enough to test a dependency from a sibling project.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localRepo'
            url = "file://${project.projectDir}/repo"
        }
        if (System.getenv('GITHUB_REPOSITORY')) {
            maven {
                name = 'GitHubPackages'
                url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY')}")
                credentials {
                    username = System.getenv('GITHUB_ACTOR')
                    password = System.getenv('GITHUB_TOKEN')
                }
            }
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

test {
    useJUnitPlatform()
}

// STUDIO-13: store publishing. Both tasks read their project id from gradle.properties and
// their token from the environment, and both fail loudly on a missing value. The release
// workflow only invokes them when the id is set, so the template itself publishes nowhere.
// Changelog comes from the GitHub release notes via -Pchangelog_file, see release.yml.
def releaseChangelog = project.hasProperty('changelog_file')
        ? file(project.property('changelog_file')).text
        : "See the GitHub release for v${mod_version}."

modrinth {
    token = System.getenv('MODRINTH_TOKEN') ?: ''
    projectId = modrinth_id
    versionNumber = project.version
    versionName = "${mod_name} ${mod_version} for ${minecraft_version}"
    versionType = 'release'
    uploadFile = tasks.jar
    gameVersions = [minecraft_version]
    loaders = ['neoforge']
    changelog = releaseChangelog
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    group = 'publishing'
    description = 'Upload the mod jar to CurseForge.'
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: ''
    def mainFile = upload(curseforge_id, tasks.jar)
    mainFile.displayName = "${mod_name} ${mod_version} for ${minecraft_version}"
    mainFile.releaseType = 'release'
    mainFile.addModLoader('NeoForge')
    mainFile.addGameVersion(minecraft_version)
    mainFile.addJavaVersion('Java 21')
    mainFile.changelog = releaseChangelog
    mainFile.changelogType = 'markdown'
}

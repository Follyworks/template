org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.debug=false

## Support matrix - see docs/support-matrix.md
# Latest Neo versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.228
neo_version_range=[21,)
loader_version_range=[4,)

# Uncomment to activate parchment mappings.
#neogradle.subsystems.parchment.minecraftVersion=1.21.1
#neogradle.subsystems.parchment.mappingsVersion=SET_ME

## Mod properties - change these five and the rest follows.
# Lowercase, matches the @Mod constant and the package leaf. Regex [a-z][a-z0-9_]{1,63}
mod_id=template
mod_name=Folly Template
mod_authors=DizzyMii
mod_description=Replace this with what the mod actually does.

# semver only. The +1.21.1 build metadata is appended by build.gradle, do not put it here.
mod_version=0.1.0

## Distribution - fill in once the project pages exist (STUDIO-16). Empty means
## the release workflow skips that store. Tokens live in GitHub Actions secrets
## (MODRINTH_TOKEN, CURSEFORGE_TOKEN), never here.
modrinth_id=
curseforge_id=

## Studio constants - do not change per mod.
mod_group_id=io.github.dizzymii.folly
mod_license=MIT
